<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Focus Self</title>
  <script>
    // GitHub Pages SPA fallback - redirect to index.html
    var path = window.location.pathname;
    var repo = '/First--cc';
    if (path.startsWith(repo + '/')) {
      sessionStorage.setItem('spa-redirect', path);
      window.location.replace(repo + '/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
