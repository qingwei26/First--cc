name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      # ===== 签名密钥处理 =====
      - name: Setup signing key
        id: signing
        working-directory: android
        run: |
          mkdir -p app/build/signing
          
          # 如果配置了 SIGNING_KEYSTORE secret，解码使用
          if [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "🔐 Using production signing key from secrets"
            echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > app/build/signing/release-keystore.p12
            echo "SIGNING_KEYSTORE_PATH=$(pwd)/app/build/signing/release-keystore.p12" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "MODE=release" >> "$GITHUB_ENV"
          else
            echo "⚠️  No signing secrets — generating temporary debug keystore"
            keytool -genkey -v \
              -keystore app/build/signing/debug-keystore.jks \
              -alias debug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass debug123 -keypass debug123 \
              -dname "CN=Debug, OU=Dev, O=FocusSelf, L=Beijing, ST=Beijing, C=CN"
            echo "SIGNING_KEYSTORE_PATH=$(pwd)/app/build/signing/debug-keystore.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=debug123" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=debug" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=debug123" >> "$GITHUB_ENV"
            echo "MODE=debug-signed" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        run: |
          echo "=== Building ${MODE} APK ==="
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            ERR=$(grep -E -A 20 "What went wrong|FAILURE:|Could not resolve|error:" /tmp/gradle.log | head -45 | tr '\n' '~' | cut -c1-2800)
            echo "::error title=Gradle Error::$ERR"
            exit $EXIT
          fi
          echo "=== APK output ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: focus-self-apk-${{ env.MODE }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ===== 如果没有签名密钥，额外提供指引 =====
      - name: Signing setup guide
        if: env.MODE == 'debug-signed'
        run: |
          echo ""
          echo "============================================"
          echo "⚠️  Build used temporary debug signature"
          echo "============================================"
          echo ""
          echo "To publish to app stores, configure production signing:"
          echo ""
          echo "1. On your local machine, run:"
          echo "   keytool -genkey -v -keystore release-keystore.jks \\"
          echo "     -alias focusself -keyalg RSA -keysize 2048 \\"
          echo "     -validity 10000 -storepass YOUR_PASSWORD"
          echo ""
          echo "2. Convert to base64:"
          echo "   base64 -w 0 release-keystore.jks > keystore-b64.txt"
          echo ""
          echo "3. Add GitHub Secrets (Repo → Settings → Secrets → Actions):"
          echo "   - SIGNING_KEYSTORE: (paste base64 content)"
          echo "   - SIGNING_STORE_PASSWORD: your keystore password"
          echo "   - SIGNING_KEY_ALIAS: focusself"
          echo "   - SIGNING_KEY_PASSWORD: your key password"
          echo ""
