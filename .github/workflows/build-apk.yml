name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Check environment
        working-directory: android
        run: |
          echo "=== Java version ==="
          java -version
          echo "=== Android SDK ==="
          echo $ANDROID_HOME
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms found"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools found"
          echo "=== Gradle version ==="
          chmod +x gradlew
          ./gradlew --version

      - name: Build APK
        working-directory: android
        run: |
          echo "=== Starting APK build ==="
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "=== Build finished ==="
          echo "=== APK files ==="
          find app/build -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug output dir not found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: focus-self-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
