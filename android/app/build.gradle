apply plugin: 'com.android.application'

// ===== Release 签名配置 =====
// 优先顺序：local.properties → CI 环境变量（GitHub Secrets）
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def signingEnabled = false
def ksFile = null
def ksStorePass = null
def ksAlias = null
def ksKeyPass = null

// 从 local.properties 读取
if (localProperties.getProperty('storeFile') && localProperties.getProperty('storePassword')) {
    def path = localProperties.getProperty('storeFile')
    // 如果是相对路径，相对于 android/ 目录
    if (!new File(path).isAbsolute()) {
        path = rootProject.file(path).absolutePath
    }
    def f = new File(path)
    if (f.exists()) {
        ksFile = f
        ksStorePass = localProperties.getProperty('storePassword')
        ksAlias = localProperties.getProperty('keyAlias', 'focusself')
        ksKeyPass = localProperties.getProperty('keyPassword', ksStorePass)
        signingEnabled = true
    }
}

// 从 CI 环境变量覆盖（优先级更高）
def envKsPath = System.getenv('SIGNING_KEYSTORE_PATH')
if (envKsPath) {
    def f = new File(envKsPath)
    if (f.exists()) {
        ksFile = f
        ksStorePass = System.getenv('SIGNING_STORE_PASSWORD')
        ksAlias = System.getenv('SIGNING_KEY_ALIAS')
        ksKeyPass = System.getenv('SIGNING_KEY_PASSWORD')
        signingEnabled = true
    }
}

if (signingEnabled) {
    println "🔐 Release signing enabled: ${ksFile.name} (alias: ${ksAlias})"
} else {
    println "⚠️  Release signing NOT configured — building unsigned APK"
}

android {
    namespace = "com.focusself.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.focusself.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingEnabled && ksFile != null) {
                storeFile ksFile
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }
    buildTypes {
        release {
            if (signingEnabled) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
